<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok Desktop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #101014;
      color: #E8E8EA;
      font-family: system-ui, sans-serif;
    }
    main { padding: 32px; max-width: 720px; }
    h1 { margin: 0 0 8px; font-size: 28px; color: #7C5CFF; }
    .ok { font-size: 18px; margin: 0 0 16px; }
    #status { color: #9A9AA3; font-size: 16px; min-height: 1.4em; }
    #setup {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #1c1c22;
      border-radius: 8px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Grok Desktop</h1>
    <p class="ok">Panel is up.</p>
    <p id="status">Starting runtime…</p>
    <div id="setup"></div>
  </main>
  <script>
    function setPanelState(s) {
      var status = document.getElementById("status");
      var setup = document.getElementById("setup");
      status.textContent = (s && s.status) ? s.status : "";
      if (s && s.setup) {
        setup.style.display = "block";
        setup.textContent = s.setup;
      } else {
        setup.style.display = "none";
        setup.textContent = "";
      }
    }
  </script>
</body>
</html>
